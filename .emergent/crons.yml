crons:
  - name: birthdays-daily
    description: "Avisa aniversariantes do dia/mês e parcelas de comissão vencidas ou vencendo em 3 dias"
    cron: "0 12 * * *"
    endpoint: "{{BASE_URL}}/api/cron/birthdays"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: supabase-sync
    description: "A cada 6 horas copia vendas, clientes, loteamentos e demais dados para o Supabase"
    cron: "0 */6 * * *"
    endpoint: "{{BASE_URL}}/api/cron/supabase-sync"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: appointments-daily
    description: "Avisa o corretor e o gestor dos compromissos da agenda do dia (visitas, plantão, ligações)"
    cron: "0 11 * * *"
    endpoint: "{{BASE_URL}}/api/cron/appointments"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: lot-reminder
    description: "Dia 3 de cada mês, lembra o gestor de atualizar as tabelas e dados técnicos dos loteamentos"
    cron: "0 12 3 * *"
    endpoint: "{{BASE_URL}}/api/cron/lot-reminder"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: calendar-sync-daily
    description: "Sincroniza diariamente a Google Agenda dos usuários conectados (vencimentos, aniversários, compromissos)"
    cron: "0 9 * * *"
    endpoint: "{{BASE_URL}}/api/cron/calendar-sync"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
